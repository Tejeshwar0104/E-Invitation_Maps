<!doctype html>
<html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Engagement Invitation</title>
<link rel="preconnect" href="https://tiles.openfreemap.org">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Mukta+Malar:wght@500;700&display=swap">
<style>
:root{--wine:#4a0f1f;--rose:#e0245e;--gold:#f2b134;--paper:#fffdf8}
*{box-sizing:border-box;margin:0}
html,body{height:100%;font-family:'Mukta Malar',system-ui,sans-serif;color:var(--wine);background:var(--wine);overflow:hidden}
#map{position:fixed;inset:0;z-index:1;background:linear-gradient(#8fc8ff,#ffe6bf 45%)}
#haze{position:fixed;inset:0 0 auto;height:34%;z-index:2;pointer-events:none;background:linear-gradient(#ffe6bfee,#ffe6bf00)}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,#0000 55%,#4a0f1f55)}
#fx{position:fixed;inset:0;z-index:7;pointer-events:none}
.names{font:italic 600 clamp(40px,12vw,64px)/1 'Cormorant Garamond',serif}
.names b{font-weight:600;color:var(--gold);margin:0 .1em}
#intro{position:fixed;inset:0;z-index:9;display:grid;place-content:center;text-align:center;gap:14px;color:#fff;background:radial-gradient(circle at 50% 40%,#7a1d35,var(--wine) 70%);transition:opacity .8s,visibility .8s}
#intro.off{opacity:0;visibility:hidden}
#intro p{font-size:15px;opacity:.85;max-width:30ch;margin:0 auto}
#intro{justify-items:center}
#intro button{background:var(--gold);color:var(--wine);border:0;border-radius:99px;padding:14px 24px;font:700 17px 'Mukta Malar';box-shadow:0 4px 16px #0005}
#intro .row{gap:10px}#intro .row button{background:none;color:#fff;border:2px solid #fff;padding:10px 18px;font-size:15px;box-shadow:none}
[hidden]{display:none!important}
#intro .bar{width:140px;height:3px;background:#ffffff30;margin:6px auto 0;border-radius:3px;overflow:hidden}
#intro .bar i{display:block;height:100%;width:40%;background:var(--gold);animation:ld 1s ease-in-out infinite alternate}
@keyframes ld{to{transform:translateX(150%)}}
#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;z-index:5;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#hud span,#hud button{pointer-events:auto;background:var(--paper);color:var(--wine);border:0;border-radius:99px;padding:8px 14px;font:700 14px 'Mukta Malar';box-shadow:0 2px 10px #0003}
#hud span:empty{visibility:hidden}
#card{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-radius:22px 22px 0 0;padding:20px 22px max(20px,env(safe-area-inset-bottom));box-shadow:0 -8px 30px #0004;transform:translateY(105%);transition:transform .8s cubic-bezier(.2,.9,.3,1);text-align:center}
#card.on{transform:none}
#card .tm{font-size:15px;color:var(--rose);font-weight:700}
#card .names{margin:6px 0 10px}
#card .l{font-size:17px;font-weight:700;line-height:1.35}
#card .a{font-size:14px;opacity:.75;margin:4px auto 14px;max-width:30ch}
.row{display:flex;gap:10px}
.row a,.row button{flex:1;padding:13px 8px;border-radius:14px;border:2px solid var(--wine);font:700 15px 'Mukta Malar';text-decoration:none;text-align:center;background:none;color:var(--wine)}
.row a{background:var(--wine);color:#fff}
.pin{display:flex;flex-direction:column;align-items:center;cursor:grab}
.pin em{white-space:nowrap;background:var(--wine);color:#fff;font:700 13px 'Mukta Malar';padding:3px 10px;border-radius:99px;font-style:normal;margin-bottom:4px;opacity:0;transition:opacity .5s .3s}
.pin .c{width:46px;height:46px;border-radius:50%;background:var(--rose);display:grid;place-items:center;font-size:22px;border:3px solid #fff;box-shadow:0 4px 14px #0006;transform:scale(0);transition:transform .5s cubic-bezier(.3,1.8,.5,1)}
.pin u{width:3px;height:20px;background:#fff;box-shadow:0 0 4px #0008}
.pin.pop em{opacity:1}.pin.pop .c{transform:scale(1);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #e0245e99}100%{box-shadow:0 0 0 26px #e0245e00}}
.you{width:16px;height:16px;border-radius:50%;background:#2a7fff;border:3px solid #fff;box-shadow:0 0 0 6px #2a7fff44}
#setup{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:8;background:var(--paper);border-radius:18px;padding:14px;box-shadow:0 4px 24px #0005}
#setup p{font-size:14px;margin-bottom:8px;line-height:1.4}
#setup input{width:100%;padding:10px;border:2px solid var(--wine);border-radius:10px;font:700 15px 'Mukta Malar';margin-bottom:8px}
body.setup #setup{display:block}body.setup #intro,body.setup #hud,body.setup #card,body.setup #haze,body.setup #vig{display:none}
</style></head><body>
<div id="map"></div><div id="haze"></div><div id="vig"></div><canvas id="fx"></canvas>
<div id="intro"><p>நிச்சயதார்த்தம் · Engagement</p><div class="names"></div><p id="ist">Map load aagudhu…</p><div class="bar"><i></i></div>
<button id="start" hidden>📍 Location allow panni start</button>
<div class="row" id="alt" hidden><button id="retry">Try again</button><button id="demo">Demo start</button></div></div>
<div id="hud"><span id="chip"></span><button id="skip" hidden>Skip</button></div>
<section id="card"><p class="tm">எங்கள் நிச்சயதார்த்தம்</p><div class="names"></div>
 <p class="l" id="when"></p><p class="l" id="where"></p><p class="a" id="addr"></p>
 <div class="row"><a id="go" target="_blank" rel="noopener">Get directions</a><button id="replay">Replay ride</button></div></section>
<section id="setup"><p><b>Pin setup:</b> Hall mela tap pannunga / pin-a drag pannunga. Illa Google Maps la copy panna "lat, lng" paste pannunga.</p>
 <input id="ll" placeholder="12.9071, 80.0930"><div class="row"><button id="cp">Copy link</button><a id="tl" target="_blank">Test ride</a></div></section>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config.js"></script>
<script>
const C=Object.assign({rideSeconds:7,bikeSize:90,bikeColor:'#e0245e',jacketColor:'#f2b134',accent:'#f2b134'},window.CONFIG),
Q=new URLSearchParams(location.search),SETUP=Q.has('setup');
if(Q.get('lat')&&Q.get('lng')){C.lat=+Q.get('lat');C.lng=+Q.get('lng')}
if(Q.get('from')){const f=Q.get('from').split(',').map(Number);C.fallbackStart=[f[1],f[0]]} // ?from=lat,lng (testing)
const V=[C.lng,C.lat],$=s=>document.querySelector(s),rad=Math.PI/180,
clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),sm=x=>(x=clamp(x))*x*(3-2*x),sleep=ms=>new Promise(r=>setTimeout(r,ms)),
lerpA=(a,b,k)=>a+(((b-a+540)%360)-180)*k,
hav=(a,b)=>{const x=Math.sin((b[1]-a[1])*rad/2)**2+Math.cos(a[1]*rad)*Math.cos(b[1]*rad)*Math.sin((b[0]-a[0])*rad/2)**2;return 12742000*Math.asin(Math.sqrt(x))},
brg=(a,b)=>{const dl=(b[0]-a[0])*rad;return(Math.atan2(Math.sin(dl)*Math.cos(b[1]*rad),Math.cos(a[1]*rad)*Math.sin(b[1]*rad)-Math.sin(a[1]*rad)*Math.cos(b[1]*rad)*Math.cos(dl))/rad+360)%360},
ease=t=>{const r=.18,v=1/(1-r);return t<r?v*t*t/(2*r):t>1-r?1-v*(1-t)**2/(2*r):v*(t-r/2)};
if(SETUP)document.body.classList.add('setup');
document.documentElement.style.setProperty('--gold',C.accent);document.documentElement.style.setProperty('--rose',C.bikeColor);
document.querySelectorAll('.names').forEach(n=>n.innerHTML=`${C.groom}<b>&amp;</b>${C.bride}`);
$('#when').textContent=`${C.date} · ${C.time}`;$('#where').textContent=C.venue;$('#addr').textContent=C.addr;
$('#go').href='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(C.venue+', '+C.addr);

/*BIKE*/
function buildBike(){
 const M=(c,e)=>new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:.15,emissive:e||0}),
 body=M(C.bikeColor),dark=M('#1b1b20'),jk=M(C.jacketColor),wht=M('#f6f6f6'),si=M('#b9bcc4'),lamp=M('#fff6c2','#ffe9a0'),
 V3=(...a)=>new THREE.Vector3(...a),
 limb=(a,b,r,m)=>{const A=V3(...a),v=V3(...b).sub(A),g=new THREE.Mesh(new THREE.CylinderGeometry(r,r,v.length(),10),m);g.position.copy(A).addScaledVector(v,.5);g.quaternion.setFromUnitVectors(V3(0,1,0),v.normalize());return g},
 sph=(r,m,p,s=[1,1,1])=>{const g=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);g.position.set(...p);g.scale.set(...s);return g},
 box=(w,l,h,m,p)=>{const g=new THREE.Mesh(new THREE.BoxGeometry(w,l,h),m);g.position.set(...p);return g},
 wheel=()=>{const g=new THREE.Group(),t=new THREE.Mesh(new THREE.TorusGeometry(.27,.08,10,30),dark),r=new THREE.Mesh(new THREE.TorusGeometry(.2,.025,6,24),si);
  t.rotation.y=r.rotation.y=Math.PI/2;g.add(t,r);for(let i=0;i<3;i++){const s=box(.03,.4,.03,si,[0,0,0]);s.rotation.x=i*Math.PI/3;g.add(s)}return g},
 root=new THREE.Group(),lean=new THREE.Group(),ch=new THREE.Group(),rw=wheel(),fw=wheel();
 rw.position.set(0,-.7,.35);ch.position.set(0,-.7,.35);fw.position.set(0,1.4,0);lean.add(rw,ch);root.add(lean);
 ch.add(fw,box(.24,.55,.3,dark,[0,.65,-.02]),sph(1,body,[0,.8,.32],[.17,.42,.16]),box(.22,.55,.09,dark,[0,.2,.34]),box(.2,.45,.14,body,[0,-.1,.4]),
  sph(.07,M('#f00','#c00'),[0,-.36,.4]),limb([.15,.9,-.18],[.17,-.45,.05],.05,si),limb([-.38,1.22,.58],[.38,1.22,.58],.025,dark),sph(.1,lamp,[0,1.34,.45]),
  limb([0,.22,.45],[0,.82,.85],.16,jk),sph(.17,wht,[0,.98,1],[1,1.1,1]),sph(.11,dark,[0,1.09,1.02],[1.1,.7,.7]));
 [-1,1].forEach(s=>ch.add(limb([.07*s,1.25,.55],[.07*s,1.4,0],.035,si),limb([.18*s,.82,.85],[.37*s,1.22,.6],.055,jk),sph(.06,dark,[.38*s,1.22,.6]),
  limb([.13*s,.22,.42],[.2*s,.7,.4],.08,dark),limb([.2*s,.7,.4],[.2*s,.3,-.12],.065,dark),sph(.08,dark,[.2*s,.3,-.12],[1,1.5,1])));
 const sh=new THREE.Mesh(new THREE.CircleGeometry(1,24),new THREE.MeshBasicMaterial({color:0,opacity:.3,transparent:true}));sh.scale.set(.45,1.2,1);sh.position.z=.03;root.add(sh);
 return{root,lean,ch,rw,fw}}
/*ENDBIKE*/

const bk=buildBike(),scene=new THREE.Scene(),dl=new THREE.DirectionalLight(0xfff1d6,1.25);
dl.position.set(-.6,-.8,1.2);scene.add(bk.root,new THREE.AmbientLight(0xffffff,.85),dl);
const B={on:false,anim:false,p:V,yaw:0,lean:0,wh:0,spin:0};let cam3,renderer;
const bikeLayer={id:'bike3d',type:'custom',renderingMode:'3d',
 onAdd(m,gl){cam3=new THREE.Camera();renderer=new THREE.WebGLRenderer({canvas:m.getCanvas(),context:gl,antialias:true});renderer.autoClear=false},
 render(gl,mx){if(!B.on)return;
  const o=maplibregl.MercatorCoordinate.fromLngLat(B.p,0),mpp=78271.517*Math.cos(B.p[1]*rad)/2**map.getZoom(),s=o.meterInMercatorCoordinateUnits()*C.bikeSize*mpp/2.1;
  bk.root.rotation.z=-B.yaw*rad;bk.lean.rotation.y=B.lean;bk.ch.rotation.x=B.wh;bk.rw.rotation.x=bk.fw.rotation.x=-B.spin;
  cam3.projectionMatrix=new THREE.Matrix4().fromArray(mx).multiply(new THREE.Matrix4().makeTranslation(o.x,o.y,o.z).scale(new THREE.Vector3(s,-s,s)));
  renderer.resetState();renderer.render(scene,cam3);if(B.anim)map.triggerRepaint()}};

const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:V,zoom:16,pitch:60,bearing:-25,maxPitch:80,interactive:SETUP,attributionControl:{compact:true}});
const loadP=new Promise(r=>map.on('load',r)),
el=(h,c)=>{const d=document.createElement('div');d.className=c;d.innerHTML=h;return d},
pinEl=el(`<em>${C.venue}</em><div class="c">💍</div><u></u>`,'pin'),
pinMk=new maplibregl.Marker({element:pinEl,anchor:'bottom'}).setLngLat(V).addTo(map);
let P=[],D=[],T=1,Lh=150,zr=15,t0=0,last=0,raf,camB=0,fired=false,start,gps=false;
const R=()=>C.rideSeconds*1000,line=c=>({type:'Feature',geometry:{type:'LineString',coordinates:c}}),
grad=(c,p)=>['step',['line-progress'],c,Math.max(p,1e-4),'rgba(255,255,255,0)'];

async function getRoute(a,b){
 try{const j=await(await fetch(`https://router.project-osrm.org/route/v1/driving/${a};${b}?overview=full&geometries=geojson`,{signal:AbortSignal.timeout(6000)})).json(),r=j.routes[0];return{pts:[a,...r.geometry.coordinates,b],km:r.distance/1000,min:r.duration/60}}
 catch(e){const d=hav(a,b);return{pts:[a,b],km:d/1000,min:d/500}}}
function prep(p){P=p;D=[0];for(let i=1;i<p.length;i++)D[i]=D[i-1]+hav(p[i-1],p[i]);T=D[D.length-1]||1;Lh=clamp(T/40,120,600)}
function at(d){d=clamp(d,0,T);let lo=0,hi=D.length-1;while(hi-lo>1){const m=(lo+hi)>>1;D[m]<=d?lo=m:hi=m}const f=(d-D[lo])/((D[hi]-D[lo])||1),a=P[lo],b=P[hi];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
function head(d,L){L=Math.min(L,T);const q=Math.min(d,T-L);return brg(at(q),at(q+L))}
function layers(){
 const w=(a,b)=>['interpolate',['linear'],['zoom'],10,a,17,b];
 map.addSource('rt',{type:'geojson',lineMetrics:true,data:line(P)});
 const L=(id,paint)=>map.addLayer({id,type:'line',source:'rt',layout:{'line-cap':'round','line-join':'round'},paint});
 L('f',{'line-color':'#4a0f1f','line-opacity':.4,'line-width':w(3,7),'line-dasharray':[1,1.8]});
 L('g',{'line-gradient':grad('#f2b134',0),'line-width':w(10,30),'line-blur':9,'line-opacity':.85});
 L('c',{'line-gradient':grad('#fff',0),'line-width':w(6,15)});
 L('d',{'line-gradient':grad(C.bikeColor,0),'line-width':w(4,9)});
 map.addLayer(bikeLayer)}
function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;
 const e0=ts-t0,r=R(),t=clamp(e0/r),d=ease(t)*T,p=at(d),a=clamp((e0-r)/2800);
 const py=B.yaw;B.yaw=lerpA(B.yaw,head(d,25),1-Math.exp(-dt*6));
 const rate=((B.yaw-py+540)%360-180)/dt;B.lean+=(clamp(rate*.012,-.45,.45)-B.lean)*(1-Math.exp(-dt*5));
 camB=lerpA(camB,head(d,Lh),1-Math.exp(-dt*1.8));
 B.wh=.62*sm((e0+1800)/500)*(1-sm(e0/900))+.5*sm((e0-r)/400)*(1-sm((e0-r-1100)/500))+(e0<0?Math.sin(ts/35)*.012:0);
 B.spin+=dt*(e0<0?35:22);B.p=p;
 const so=75*(1-sm(e0/1800)),base=18.3-.7*sm(e0/2000),bump=sm(t/.2)*(1-sm((t-.8)/.2));
 let z=base-(base-zr)*bump,c=p,bear=camB+so;
 if(a>0){const s=sm(a);c=[p[0]+(V[0]-p[0])*s,p[1]+(V[1]-p[1])*s];bear=camB+60*s;z+=(18.1-z)*s;map.setPadding({top:innerHeight*.3*(1-s),bottom:290*s,left:0,right:0});
  if(!fired){fired=true;pinEl.classList.add('pop');petals()}if(a>.5)$('#card').classList.add('on')}
 const pr=d/T;['g','c','d'].forEach((id,i)=>map.setPaintProperty(id,'line-gradient',grad(['#f2b134','#fff',C.bikeColor][i],pr)));
 if(e0>0)$('#chip').textContent=((T-d)/1000).toFixed(1)+' km to go';
 map.jumpTo({center:c,bearing:bear,zoom:z,pitch:a>0?62+4*(1-sm(a)):66});
 if(a<1)raf=requestAnimationFrame(frame);else{B.anim=false;$('#skip').hidden=true;$('#chip').textContent='Vaanga vaanga! 🎉';map.triggerRepaint()}}
function play(){
 cancelAnimationFrame(raf);$('#card').classList.remove('on');pinEl.classList.remove('pop');
 B.p=P[0];B.yaw=camB=head(0,Lh);B.lean=0;B.on=B.anim=true;fired=false;
 map.setPadding({top:innerHeight*.3,bottom:0,left:0,right:0});
 map.jumpTo({center:P[0],zoom:18.3,pitch:62,bearing:camB+75});
 const now=performance.now();last=now;t0=now+1800;$('#skip').hidden=false;
 if(matchMedia('(prefers-reduced-motion:reduce)').matches||T<80)t0=now-R()-3000;
 raf=requestAnimationFrame(frame)}
function petals(){const c=$('#fx'),x=c.getContext('2d'),cols=['#f2b134','#e0245e','#ffd166','#fff'];c.width=innerWidth;c.height=innerHeight;
 const ps=[...Array(80)].map(()=>({x:Math.random()*c.width,y:-Math.random()*c.height*.7,s:5+Math.random()*7,vy:1.5+Math.random()*2.5,vx:Math.random()*2-1,r:Math.random()*6,vr:Math.random()*.1-.05,c:cols[Math.random()*4|0]}));let f=0;
 (function d(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx+Math.sin(f/20+p.r);p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.beginPath();x.ellipse(0,0,p.s,p.s/2,0,0,7);x.fill();x.restore()});++f<280?requestAnimationFrame(d):x.clearRect(0,0,c.width,c.height)})()}
function setup(){
 pinEl.classList.add('pop');pinMk.setDraggable(true);map.jumpTo({zoom:18,pitch:45});
 const upd=()=>{const p=pinMk.getLngLat();$('#ll').value=p.lat.toFixed(6)+', '+p.lng.toFixed(6);const u=location.origin+location.pathname+`?lat=${p.lat.toFixed(6)}&lng=${p.lng.toFixed(6)}`;$('#tl').href=u;return u};
 pinMk.on('dragend',upd);map.on('click',e=>{pinMk.setLngLat(e.lngLat);upd()});upd();
 $('#ll').onchange=()=>{const[a,b]=$('#ll').value.split(',').map(Number);if(a&&b){pinMk.setLngLat([b,a]);map.flyTo({center:[b,a],zoom:18});upd()}};
 $('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(upd());$('#cp').textContent='Copied ✓'}}
$('#skip').onclick=()=>{t0=performance.now()-R()-50};$('#replay').onclick=play;

const G=hi=>new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(q=>r({ll:[q.coords.longitude,q.coords.latitude]}),e=>r({err:e.code}),{enableHighAccuracy:hi,timeout:hi?12000:10000,maximumAge:30000}):r({err:2})),
say=t=>$('#ist').textContent=t;
async function locate(){let r=await G(true);if(r.err&&r.err!==1)r=await G(false);return r}
function deny(c){$('#start').hidden=true;$('#alt').hidden=false;
 say(c===0?'Idhu https link illa, so phone location block pannum. GitHub (https) link la open pannunga.':c===1?'Location blocked. Chrome address bar la 🔒 → Permissions → Location → Allow, appuram Try again.':c===2?'Phone Location/GPS OFF. Location on pannitu Try again.':'Location kedaikala. Try again, illa Demo start use pannunga.')}
async function go(ll,real){
 gps=real;start=ll;say('Route podhuren…');
 const r=await getRoute(start,V);prep(r.pts);zr=clamp(16.8-Math.log2(Math.max(r.km,1)/1.5)*.9,11.5,16.5);
 map.getSource('rt')?map.getSource('rt').setData(line(P)):layers();
 new maplibregl.Marker({element:el('','you')}).setLngLat(start).addTo(map);
 $('#chip').textContent=`${r.km.toFixed(1)} km · ~${Math.round(r.min)} min`+(gps?'':' · demo start');
 $('#intro').classList.add('off');play()}
$('#start').onclick=$('#retry').onclick=async()=>{ // runs on a tap, so phone Chrome shows the permission popup
 $('#start').hidden=$('#alt').hidden=true;
 if(!window.isSecureContext)return deny(0);
 say('Location edukkuren… Allow kudunga 📍');
 const r=await locate();r.ll?go(r.ll,true):deny(r.err)};
$('#demo').onclick=()=>go(C.fallbackStart,false);
(async()=>{await loadP;if(SETUP)return setup();say('Ready! Keezha tap pannunga 👇');$('#start').hidden=false;
 try{const q=await navigator.permissions.query({name:'geolocation'});if(q.state==='denied')deny(1)}catch(e){}})();
</script></body></html>
